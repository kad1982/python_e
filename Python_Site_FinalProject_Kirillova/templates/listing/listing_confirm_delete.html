{% extends 'base.html' %}
{% load static %}

{% block title %}Удаление объявления — RentStyle{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <div class="text-danger mb-3">
                    <i class="fas fa-exclamation-triangle fa-4x"></i>
                </div>
                <h3 class="fw-bold mb-3">Удалить объявление?</h3>
                <p class="text-muted mb-4">
                    Вы собираетесь удалить <strong>"{{ listing.title }}"</strong>. 
                    Это действие нельзя отменить.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'listing:listing_detail' listing.pk %}" class="btn btn-outline-secondary px-4">Отмена</a>
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
