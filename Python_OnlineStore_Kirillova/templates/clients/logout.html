{% extends 'base.html' %}
{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body text-center py-5">
                <i class="fas fa-sign-out-alt text-primary" style="font-size: 4rem;"></i>
                <h2 class="mt-3">Вы вышли из системы</h2>
                <p class="text-muted">Спасибо, что посетили наш магазин!</p>
                <div class="mt-4">
                    <a href="{% url 'clients:login' %}" class="btn btn-primary me-2">
                        <i class="fas fa-sign-in-alt me-1"></i>Войти снова
                    </a>
                    <a href="{% url 'homepage:index' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-home me-1"></i>На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
