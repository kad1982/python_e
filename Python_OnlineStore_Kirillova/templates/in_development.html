{% extends 'base.html' %}
{% load static %}

{% block title %}Страница в разработке{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <!-- Иконка или изображение -->
                    <div class="mb-4">
                        <i class="fas fa-hard-hat fa-5x text-warning"></i>
                    </div>
                    
                    <h1 class="display-4 fw-bold mb-3">В разработке</h1>
                    <div class="progress mb-4" style="height: 10px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" 
                             style="width: 65%;"></div>
                    </div>
                    <p class="lead text-muted mb-4">
                        Мы работаем над этой страницей.<br>
                        Скоро здесь появится что-то интересное!
                    </p>
                    
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'homepage:index' %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-home me-2"></i>На главную
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-arrow-left me-2"></i>Назад
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .card {
        transition: transform 0.3s ease;
    }
    .card:hover {
        transform: translateY(-5px);
    }
    .progress-bar {
        transition: width 2s ease-in-out;
    }
</style>
{% endblock %}
